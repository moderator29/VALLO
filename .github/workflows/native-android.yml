# Native Android: the first real compile of the app (28 September 2026).
#
# The Claude sandbox cannot build Android at all (its network policy blocks
# dl.google.com, so neither the SDK nor the Android Gradle Plugin can be
# fetched). GitHub's ubuntu runners ship the Android SDK and reach Google's
# Maven, so this job is the first place the Android project is ever compiled.
#
# WHAT IT BUILDS: a DEBUG APK (`assembleDebug`). It needs no secret and no
# founder value:
#   - `cap:sync:dev` is used, not `cap:sync`, because the release sync refuses
#     while the association files carry placeholders (DOC-13). The dev sync
#     prints the same warnings and carries on. The ORIGIN is still production.
#   - `app/build.gradle` refuses only RELEASE builds while
#     `google-services.json` holds the placeholder API key; a debug build logs
#     the error and builds without Firebase. The APK then installs and runs,
#     and turning notifications on reports a failure instead of crashing (the
#     bridge catches the plugin's FirebaseApp exception).
#
# WHAT IT DOES NOT PROVE: that R8 and the release signing config produce a
# working bundle. That is the second job.
#
# 2. `release`: the SIGNED Android App Bundle for Play. By hand only (Actions,
#    Native Android, Run workflow, "release" ticked), like the iOS archive, so
#    it never burns minutes on a push. SCAFFOLDED AND INERT until the founder
#    adds the four keystore secrets; with one missing it fails at its first
#    step and names what is missing, never a silent pass:
#
#      ANDROID_KEYSTORE_BASE64    the upload keystore, base64 encoded
#                                 (`base64 -i upload-keystore.jks`)
#      ANDROID_KEYSTORE_PASSWORD  the store password
#      ANDROID_KEY_ALIAS          the key's alias inside the store, e.g. upload
#      ANDROID_KEY_PASSWORD       the key's own password
#
#    All four are encrypted Actions SECRETS (Settings, Secrets and variables,
#    Actions, Secrets). docs/NATIVE_CI.md has the click path. NOTHING SECRET
#    IS, OR WILL BE, IN THIS REPOSITORY: the keystore is written to the runner
#    only, under $RUNNER_TEMP where it is outside the checkout, and removed in
#    a step that runs whatever happens.
#
#    THE ONE THING THAT MUST NOT BE SILENT. `app/build.gradle` wires the
#    release signing config ONLY when `android/keystore.properties` exists,
#    and `bundleRelease` happily produces an UNSIGNED bundle when it does not.
#    An unsigned bundle is rejected at upload rather than published, but it
#    costs a whole cycle to find out, so the signature is verified on the
#    runner before the artefact is kept, and the job fails if it is absent.
#
#    IT DOES NOT UPLOAD. Publishing to Play needs a service account JSON with
#    the Android Publisher role, which is a separate secret and a separate
#    decision; the founder downloads the .aab from the run's Artifacts and
#    uploads it in the Play Console.
#
# FIRST COMPILE: run 36500914409 (29 September 2026) built the first APK.
# The APK's size and SHA-256 are printed in the "Describe the APK" step of
# every run.
name: Native Android

on:
  push:
    branches: [main]
    paths:
      - "apps/web/android/**"
      - "apps/web/capacitor.config.ts"
      - "apps/web/native-shell/**"
      - "apps/web/package.json"
      - "apps/web/scripts/write-shell-config.mjs"
      - "apps/web/scripts/check-deep-links.mjs"
      - "package-lock.json"
      - "scripts/sync-native-versions.mjs"
      - ".github/workflows/native-android.yml"
  pull_request:
    branches: [main]
    # The same list as push: a pull request that changes the sync scripts
    # changes what this build does.
    paths:
      - "apps/web/android/**"
      - "apps/web/capacitor.config.ts"
      - "apps/web/native-shell/**"
      - "apps/web/package.json"
      - "apps/web/scripts/write-shell-config.mjs"
      - "apps/web/scripts/check-deep-links.mjs"
      - "package-lock.json"
      - "scripts/sync-native-versions.mjs"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the SIGNED release bundle for Play (needs the four keystore secrets)"
        type: boolean
        default: false

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  debug:
    name: Android debug build
    # Founder rule (9 November 2026): the phone builds burn minutes about ten
    # times faster and need his word first. The working branch's draft pull
    # request exists only to run CI, so its pushes never start a phone build;
    # main, other pull requests and a by-hand run are unchanged.
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'platform-grade-1-readiness') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The production origin, the same value every release sync uses. Not a
      # secret: it is the public website.
      CAPACITOR_SERVER_URL: https://www.vallospaces.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Capacitor 8's android library compiles with Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Native versions match package.json
        run: npm run sync:versions -- --check

      - name: Capacitor sync (production origin, dev gate)
        run: npm run cap:sync:dev --workspace @vallo/web

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # A failed build keeps Gradle's own reports, so the reason is on the run
      # page rather than only in a truncated log.
      - name: Keep the Gradle reports when the build fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-reports-${{ github.sha }}
          path: |
            apps/web/android/build/reports
            apps/web/android/app/build/reports
          retention-days: 14
          if-no-files-found: ignore

      - name: Describe the APK
        if: ${{ success() }}
        run: |
          apk=apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          size=$(du -h "$apk" | cut -f1)
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          # In the log as well as the summary: the API exposes job logs but
          # not step summaries, and this is the line people quote.
          echo "APK $(stat -c %s "$apk") bytes (${size}), sha256 ${sum}, commit ${GITHUB_SHA}"
          {
            echo "## Android debug build compiled"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| APK | \`app-debug.apk\`, ${size} |"
            echo "| SHA-256 | \`${sum}\` |"
            echo "| Origin | ${CAPACITOR_SERVER_URL} |"
            echo ""
            echo "Debug-signed, for testing on a handset only (\`adb install app-debug.apk\`). Push is inactive until the Firebase Android key is in google-services.json. Not uploadable to Play."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: vallo-android-debug-${{ github.sha }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # C15 (30 September 2026): the first time the APK meets a phone, even an
  # emulated one. Installs the debug APK from the job above on an Android 14
  # emulator and runs the P0 rows of docs/VALLO_NATIVE_TEST_MATRIX.md that
  # need no account: cold launch online (row 1), a deep link to /open, the
  # back button at the root (row 23), and a cold launch with the network off
  # (row 2). A screenshot of each is kept under Artifacts; the pass or fail is
  # a person looking at them, because a web view's content is not readable to
  # adb. `continue-on-error` so an emulator that fails to boot never blocks a
  # build that compiled.
  emulator:
    name: Android emulator smoke (no account)
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vallo-android-debug-${{ github.sha }}
          path: apk

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the no-account P0 rows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r apk/app-debug.apk
            adb shell monkey -p com.vallospaces.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > shots/01-cold-launch-online.png
            adb shell am start -W -a android.intent.action.VIEW -d "https://www.vallospaces.com/open" com.vallospaces.app || true
            sleep 12
            adb exec-out screencap -p > shots/02-deep-link-open.png
            adb shell input keyevent 4
            sleep 4
            adb exec-out screencap -p > shots/03-back-at-root.png
            adb shell am force-stop com.vallospaces.app
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell monkey -p com.vallospaces.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > shots/04-cold-launch-offline.png
            adb shell svc wifi enable
            adb shell svc data enable
            adb logcat -d -s Capacitor:* chromium:* AndroidRuntime:E > shots/logcat.txt || true

      - name: Keep the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-smoke-${{ github.sha }}
          path: shots
          retention-days: 14
          if-no-files-found: warn

  # THE SIGNED BUNDLE FOR PLAY (12 November 2026). Documented at the head of
  # this file. `needs: debug` so a project that does not even compile never
  # reaches the signing step and never touches the keystore.
  release:
    name: Android signed release bundle (Play)
    needs: debug
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: https://www.vallospaces.com
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Every keystore secret is present
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Android signing is not configured::Missing secrets:$missing. See docs/NATIVE_CI.md. Nothing was built or signed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The versionCode must rise with every upload Play accepts, and the run
      # number does. The encoding is in scripts/sync-native-versions.mjs:
      # (major * 10000 + minor * 100 + patch) * 1000 + build, so 1.0.2 at run
      # 41 is 10002041. THE BUILD SLOT HOLDS 0 TO 999 and the script refuses a
      # larger one, so this workflow's run number reaching 1000 is a hard stop
      # that has to be answered by widening the encoding, not by a retry. The
      # iOS archive job carries the same ceiling.
      - name: Write versions
        run: VALLO_BUILD=${{ github.run_number }} npm run sync:versions

      # The release gate, scoped to Android: it refuses while the Android
      # association values are placeholders, so no signed bundle claims an App
      # Link that cannot verify. Scoped so a staged launch is never blocked on
      # iOS values.
      - name: Capacitor sync (release gate)
        run: npm run cap:sync:android --workspace @vallo/web

      # THE KEYSTORE GOES TO THE RUNNER ONLY, AND OUTSIDE THE CHECKOUT.
      # `app/build.gradle` reads `android/keystore.properties` and resolves
      # `storeFile` through `rootProject.file`, which is relative to
      # `apps/web/android`, so the properties file names an absolute path under
      # $RUNNER_TEMP. Nothing written here is inside the git working tree
      # except keystore.properties itself, which `android/.gitignore` refuses
      # to track, and both are removed below.
      #
      # The two passwords are written by `printf` from the environment rather
      # than interpolated into the YAML, so they are never a command line any
      # process listing could show, and `::add-mask::` keeps a stray echo out
      # of the log.
      - name: Write the keystore to the runner only
        run: |
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing"
          chmod 700 "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/signing/upload.jks"
          if [ ! -s "$RUNNER_TEMP/signing/upload.jks" ]; then
            echo "::error title=The keystore did not decode::ANDROID_KEYSTORE_BASE64 is set but produced an empty file. Re-encode the .jks with base64 and paste the whole string. Nothing was signed."
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/signing/upload.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > apps/web/android/keystore.properties
          chmod 600 apps/web/android/keystore.properties

      # The alias has to exist in the store, and `keytool` says so in one line
      # without unlocking a single key. A wrong alias otherwise surfaces as a
      # Gradle stack trace four minutes into R8.
      - name: The alias is in the keystore
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/signing/upload.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=The key alias is not in this keystore::ANDROID_KEY_ALIAS does not name a key in the keystore ANDROID_KEYSTORE_BASE64 decoded to, or ANDROID_KEYSTORE_PASSWORD is wrong. Nothing was signed."
            exit 1
          fi

      # bundleRelease, not assembleRelease: Play takes an App Bundle and
      # builds the per-device APKs itself. R8 runs here (`minifyEnabled true`),
      # which the debug job above never exercises, so this is also the first
      # place a missing ProGuard keep rule can show itself.
      - name: Build the release bundle
        working-directory: apps/web/android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      # THE CHECK THE WHOLE JOB EXISTS FOR. `app/build.gradle` wires the
      # release signing config only when keystore.properties is present, and
      # produces an UNSIGNED bundle when it is not, on purpose and quietly. A
      # bundle that reaches this step unsigned means the steps above did not do
      # what they claim, and it must not be kept as if it were publishable.
      - name: The bundle is signed
        run: |
          aab=apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$aab" ]; then
            echo "::error title=No bundle::$aab was not produced."
            exit 1
          fi
          if ! unzip -l "$aab" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo "::error title=The bundle is NOT signed::No signature block in $aab. app/build.gradle wires the release signingConfig only when android/keystore.properties exists, so the keystore step did not take effect. Nothing was kept."
            exit 1
          fi
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"

      - name: Describe the bundle
        run: |
          aab=apps/web/android/app/build/outputs/bundle/release/app-release.aab
          size=$(du -h "$aab" | cut -f1)
          sum=$(sha256sum "$aab" | cut -d' ' -f1)
          code=$(grep -m1 -oE 'versionCode +[0-9]+' apps/web/android/app/build.gradle | awk '{print $2}')
          name=$(grep -m1 -oE 'versionName +"[^"]+"' apps/web/android/app/build.gradle | cut -d'"' -f2)
          echo "AAB $(stat -c %s "$aab") bytes (${size}), versionCode ${code}, versionName ${name}, sha256 ${sum}, commit ${GITHUB_SHA}"
          {
            echo "## Android signed release bundle"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Bundle | \`app-release.aab\`, ${size} |"
            echo "| versionName | ${name} |"
            echo "| versionCode | ${code} |"
            echo "| SHA-256 | \`${sum}\` |"
            echo "| Origin | ${CAPACITOR_SERVER_URL} |"
            echo ""
            echo "Signed with the upload key, R8 on, debuggable off. Download it from Artifacts and upload it in the Play Console. Play refuses a versionCode it has already accepted, so a second attempt at the same version needs a new run of this workflow, never a re-upload of this file."
          } >> "$GITHUB_STEP_SUMMARY"

      # Mapping files or a crash in Play Console is unreadable, and R8 renames
      # everything. Keep them with the bundle that they belong to.
      - name: Keep the bundle and the R8 mapping
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: vallo-android-release-${{ github.run_number }}
          path: |
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
            apps/web/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

      - name: Keep the Gradle reports when the build fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release-reports-${{ github.run_number }}
          path: |
            apps/web/android/build/reports
            apps/web/android/app/build/reports
          retention-days: 14
          if-no-files-found: ignore

      # Whatever happened, including a cancellation.
      - name: Remove the keystore from the runner
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/signing" apps/web/android/keystore.properties
